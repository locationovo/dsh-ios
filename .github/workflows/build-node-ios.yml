name: build-node-ios-locationovo

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version to build"
        required: false
        default: "24.21.0"
      runner:
        description: "macos-14 = arm64 3 cores/7 GB (free). macos-15-intel = x64"
        required: false
        default: "macos-14"
  push:
    paths:
      - "node-ios/**"
      - ".github/workflows/build-node-ios.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'macos-14' }}
    timeout-minutes: 360

    env:
      NODE_VERSION: ${{ github.event.inputs.node_version || '24.21.0' }}
      CACHE_REV: "2"
      CACHE_DIR: ${{ github.workspace }}/../node-ios-cache
      SRC_DIR: ${{ github.workspace }}/../node-src

    steps:
      - uses: actions/checkout@v4

      - name: Pin Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        run: |
          set -euxo pipefail
          echo "arch: $(uname -m)  cores: $(sysctl -n hw.ncpu)  ram: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "clang: $(clang --version | head -1)"
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list ccache >/dev/null 2>&1 || brew install ccache
          brew install dpkg || true

      - name: Record the machine and publish it
        run: |
          set -eu
          mkdir -p dist
          {
            echo "runner label: ${{ github.event.inputs.runner || 'macos-14' }}"
            echo "cpu:          $(sysctl -n machdep.cpu.brand_string)"
            echo "arch:         $(uname -m)"
            echo "cores:        $(sysctl -n hw.ncpu)"
            echo "ram:          $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          } | tee dist/machine.txt
          git config user.name "locationovo"
          git config user.email "locationovo@outlook.com"
          if git fetch origin ci-logs 2>/dev/null; then
            git checkout -B ci-logs FETCH_HEAD
          else
            git checkout -B ci-logs
          fi
          mkdir -p ci-logs
          cp dist/machine.txt "ci-logs/machine-${GITHUB_RUN_NUMBER}.txt"
          git add -f ci-logs
          git commit -m "machine info for run ${GITHUB_RUN_NUMBER}" || exit 0
          git push --force origin ci-logs

      - name: Cache source tarball, ccache, and build tree
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CACHE_DIR }}
            ~/.ccache
            ${{ env.SRC_DIR }}/node-v${{ env.NODE_VERSION }}/out
          key: node-ios-${{ env.NODE_VERSION }}-rev${{ env.CACHE_REV }}-${{ runner.arch }}
          restore-keys: |
            node-ios-${{ env.NODE_VERSION }}-rev${{ env.CACHE_REV }}-
            node-ios-${{ env.NODE_VERSION }}-

      - name: Patch, configure, build, sign
        run: sh node-ios/build-node-ios.sh

      - name: Package as deb for nodefix
        run: |
          set -e
          PKG_NAME="com.locationovo.node${NODE_VERSION}"
          PKG_DIR="pkg"
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/var/jb/usr/local/lib/nodejs/versions/v${NODE_VERSION}/bin

          cp dist/node-v*-iphoneos-arm64 ${PKG_DIR}/var/jb/usr/local/lib/nodejs/versions/v${NODE_VERSION}/bin/node
          chmod 755 ${PKG_DIR}/var/jb/usr/local/lib/nodejs/versions/v${NODE_VERSION}/bin/node

          cat > ${PKG_DIR}/DEBIAN/control <<EOF
          Package: ${PKG_NAME}
          Name: Node.js ${NODE_VERSION} (locationovo fork)
          Version: ${NODE_VERSION}
          Architecture: iphoneos-arm64e
          Description: Node.js ${NODE_VERSION} pre-packaged for nodefix (Based on xlpoistop-prog's CI)
          Maintainer: locationovo <locationovo@outlook.com>
          Author: locationovo <locationovo@outlook.com>, XLPOISTOP-prog
          Section: Development
          Depends: firmware (>= 15.0), com.locationovo.nodefix, zsh, ldid
          EOF

          cat > ${PKG_DIR}/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          JBROOT=$(ls -dt /var/containers/Bundle/Application/.jbroot-* /var/mobile/Containers/Shared/AppGroup/.jbroot-* 2>/dev/null | head -1 | tr -d '@')
          if [ -n "$JBROOT" ] && [ -x "$JBROOT/usr/local/bin/nodefix" ]; then
            mkdir -p "$JBROOT/usr/local/lib/nodejs"
            echo "v__NODE_VERSION__" > "$JBROOT/usr/local/lib/nodejs/active_version"
            "$JBROOT/usr/local/bin/nodefix" install || true
          fi
          exit 0
          EOF
          sed -i '' "s/__NODE_VERSION__/${NODE_VERSION}/g" ${PKG_DIR}/DEBIAN/postinst
          chmod 755 ${PKG_DIR}/DEBIAN/postinst

          dpkg-deb -Zgzip -b ${PKG_DIR} ${PKG_NAME}_${NODE_VERSION}_iphoneos-arm64e.deb

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: node-v${{ env.NODE_VERSION }}-deb-locationovo
          path: |
            com.locationovo.node*.deb
            dist/node-v*-iphoneos-arm64.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Show the tail of the build log
        if: always()
        run: tail -40 dist/build.log || true

      - name: Publish the build log to the ci-logs branch
        if: always()
        run: |
          set -eu
          if [ ! -f dist/build.log ]; then
            echo "no build.log was produced"
            exit 0
          fi
          git config user.name "locationovo"
          git config user.email "locationovo@outlook.com"
          if git fetch origin ci-logs 2>/dev/null; then
            git checkout -B ci-logs FETCH_HEAD
          else
            git checkout -B ci-logs
          fi
          mkdir -p ci-logs
          cp dist/build.log "ci-logs/build-${GITHUB_RUN_NUMBER}.log"
          git add -f ci-logs
          git commit -m "build log for run ${GITHUB_RUN_NUMBER}" || exit 0
          git push --force origin ci-logs
